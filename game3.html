:root{--ink:#40515b;--red:#d77c62;--paper:#fff8e8;--blue:#4c8897}
html,body{background:#eef4e8}
#grain{opacity:.06}
#vignette{background:radial-gradient(ellipse at center,transparent 70%,rgba(108,145,121,.07))}
.sketch{background:rgba(255,252,240,.94);border:1.5px solid #657c76;box-shadow:2px 3px 0 rgba(86,109,95,.06)}
.sketch:before{width:48px;margin-left:-24px;height:15px;top:-8px;background:#ecdfa78c}
#hud{top:22px;left:22px;padding:11px 17px 10px;font-size:18px;line-height:1.25;transform:rotate(-1deg);min-width:114px}
#hud .score{font:700 32px var(--font-hand);line-height:1;color:#bf765a}
#hud .hud-small{font-size:15px;color:#71827d}
#hud .charges{font-size:21px;color:#a39e52;letter-spacing:3px}
#collection{top:auto;bottom:48px;left:22px;font-size:16px;background:#fffbefbd;border:0;border-radius:10px;padding:7px 12px;color:#64786b}
#altbar{width:6px;right:27px;top:auto;bottom:66px;height:90px;border:1px solid #8ba397;background:#dce9d5a6;border-radius:5px}
#altlabel{font-size:13px;left:-20px;top:-23px;width:46px;color:#71867c}
#altmark{font-size:19px;left:-13px;width:31px;color:#b78954;transform:translateY(50%)}
#combo{font-size:32px;top:24px;right:auto;left:185px;color:#bd7d53;text-decoration:none;transform:rotate(-4deg)}
#combo.pop{animation:gentlePop .25s ease-out}
@keyframes gentlePop{from{transform:rotate(-4deg) scale(1.14)}to{transform:rotate(-4deg) scale(1)}}
#flash{top:auto;bottom:94px;font:22px 'Patrick Hand',cursive;color:#568b6f;transform:none}
.float{font-size:23px;text-shadow:0 1px 4px #fff8e8;animation:floatUp .7s ease-out forwards}
.float.big{font-size:29px}
#msg .card{padding:28px 38px 24px;width:min(410px,80vw);font-size:21px;transform:rotate(-.6deg);border-radius:28px 12px 26px 14px;max-height:80vh}
#msg h1{font-size:56px;line-height:1.06;color:#bb7557;transform:rotate(-2deg);text-decoration:none;margin-bottom:10px}
#msg small{font-size:16px;color:#7f9083}
.welcome-sub{color:#789780;margin:0 0 18px;font-size:22px}
.welcome-icons{display:flex;justify-content:center;gap:26px;color:#6e8c7c;font-size:16px;margin:18px 0}
.welcome-icons b{display:block;font-size:30px;font-weight:normal;color:#b39655}
.play-button{display:block;margin:18px auto 16px;padding:9px 32px;border:1.5px solid #6c9278;background:#dceccb;color:#4c755a;border-radius:20px 12px 18px 12px;cursor:pointer;pointer-events:auto;font:24px var(--font-hand);box-shadow:0 3px 0 #aec69b66}
.play-button:hover{background:#cfe4ba;transform:translateY(-1px)}
